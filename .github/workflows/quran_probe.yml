name: Quran Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-hosny-amiri libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python packages
        run: pip install requests pillow fonttools

      - name: Run probe
        run: python probe_quran.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe_output
          git commit -m "Quran probe results" || echo "nothing to commit"
          git push
