name: Generate Quran Clip

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # للسماح برفع Releases وتحديث قاعدة البيانات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, RAQM, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfribidi-dev fonts-hosny-amiri

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow fonttools google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Clip Generator
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 quran_clip_generator.py

      - name: Upload Video to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 drive_uploader.py

      - name: Upload Direct MP4 to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: Quran Clip #${{ github.run_number }}
          files: generated_videos/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save DB State (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quran_clips.db
          git diff-index --quiet HEAD || git commit -m "chore: update quran clips database [skip ci]"
          git push
