name: Generate and Publish Quran Clip

on:
  schedule:
    # يعمل 4 مرات يومياً: 2 الظهر، 5 المغرب، 8 بالليل، 10 بالليل (توقيت مصر / السعودية)
    - cron: '0 11,14,17,19 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي بزر Run workflow في أي وقت

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # للسماح برفع Releases وتحديث قاعدة البيانات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, RAQM, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfribidi-dev fonts-hosny-amiri

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow fonttools

      - name: Run Clip Generator & Publish
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          python3 quran_clip_generator.py

      - name: Save DB State (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quran_clips.db
          git diff-index --quiet HEAD || git commit -m "chore: update quran clips database [skip ci]"
          git push
