name: Generate and Publish Quran Clip

on:
  schedule:
    - cron: '7 14 * * *'   # 2:07 م بتوقيت القاهرة
      timezone: 'Africa/Cairo'
    - cron: '7 22 * * *'   # 10:07 م بتوقيت القاهرة
      timezone: 'Africa/Cairo'
  
    - cron: '7 15 * * *'   # 3:07 م بتوقيت القاهرة
      timezone: 'Africa/Cairo'
    - cron: '7 20 * * *'   # 8:07 م بتوقيت القاهرة
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      reciter:
        description: 'القارئ'
        required: false
        default: 'minshawi'
        type: choice
        options:
          - minshawi
          - dussary
          - abdulbasit
          - abdulbasit_mujawwad
          - alafasy
          - sudais
          - husary
          - shatri
          - rifai
          - shuraym
      surah:
        description: 'رقم سورة ثابت (سيبه فاضي عشان يكمّل تلقائياً من آخر مقطع)'
        required: false
        default: ''
        type: string
      check_reciters:
        description: 'فحص القراء فقط (من غير إنتاج أو نشر فيديو)'
        required: false
        default: false
        type: boolean

# ما يشتغلش تشغيلين مع بعض (عشان ما يحصلش تعارض على quran_clips.db)
concurrency:
  group: quran-clip
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # لرفع Releases وتحديث قاعدة البيانات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg, RAQM, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libraqm-dev libfribidi0 libfribidi-dev libharfbuzz0b fonts-hosny-amiri

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow

      - name: Verify RAQM, FFmpeg and font
        run: |
          python3 -c "from PIL import features; assert features.check('raqm'), 'RAQM مش شغال'; print('RAQM OK')"
          ffmpeg -version | head -1
          fc-list | grep -i "Amiri" || (echo "خط Amiri مش موجود" && exit 1)

      - name: Run Clip Generator & Publish
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # يدوي: اللي تختاره. مجدول: المتغير DEFAULT_RECITER (Settings → Variables) أو minshawi
          RECITER: ${{ inputs.reciter || vars.DEFAULT_RECITER || 'minshawi' }}
          SURAH: ${{ inputs.surah }}
          START_SURAH: '2'
          # shared = يكمل بعد آخر مقطع في الداتا بيز (أي قارئ) | per_reciter = تقدم مستقل لكل قارئ
          PROGRESS_MODE: ${{ vars.PROGRESS_MODE || 'shared' }}
          CHECK_RECITERS: ${{ inputs.check_reciters && '1' || '0' }}
          BG_MODE: ${{ vars.BG_MODE || 'black' }}
          LINES_PER_CARD: ${{ vars.LINES_PER_CARD || '2' }}
          HIGHLIGHT: ${{ vars.HIGHLIGHT || '0' }}
        run: |
          python3 quran_clip_generator.py

      - name: Upload video on failure (للتشخيص)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-video
          path: generated_videos/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save DB State (Commit & Push)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quran_clips.db
          if git diff --cached --quiet; then
            echo "مفيش تغيير في قاعدة البيانات"
          else
            git commit -m "chore: update quran clips database [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
