name: Generate and Publish Quran Clip

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # للسماح برفع Releases وتحديث قاعدة البيانات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, RAQM, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfribidi-dev fonts-hosny-amiri

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow fonttools

      - name: Run Clip Generator & Publish
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 quran_clip_generator.py

      - name: Save DB State (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quran_clips.db
          git diff-index --quiet HEAD || git commit -m "chore: update quran clips database [skip ci]"
          git push
