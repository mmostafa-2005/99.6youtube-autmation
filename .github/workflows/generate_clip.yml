name: Generate and Publish Quran Clip

on:
  schedule:
    # كل المواعيد بتوقيت UTC. الدقايق مش 0 عشان GitHub بيأخّر أو بيسقّط
    # الـ jobs اللي بتبدأ على رأس الساعة وقت الضغط.
    - cron: '7 11 * * *'
    - cron: '23 14 * * *'
    - cron: '41 17 * * *'
    - cron: '13 19 * * *'
  workflow_dispatch:

# ما يشتغلش تشغيلين مع بعض (عشان ما يحصلش تعارض على quran_clips.db)
concurrency:
  group: quran-clip
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # لرفع Releases وتحديث قاعدة البيانات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, RAQM, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfribidi-dev fonts-hosny-amiri

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow fonttools

      - name: Verify RAQM and font
        run: |
          python3 -c "from PIL import features; assert features.check('raqm'), 'RAQM مش شغال'; print('RAQM OK')"
          fc-list | grep -i "AmiriQuran" || (echo "خط AmiriQuran مش موجود" && exit 1)

      - name: Run Clip Generator & Publish
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 quran_clip_generator.py

      - name: Save DB State (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quran_clips.db
          if git diff --cached --quiet; then
            echo "مفيش تغيير في قاعدة البيانات"
          else
            git commit -m "chore: update quran clips database [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
